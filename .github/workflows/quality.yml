name: quality

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install ruff
      - run: python -m ruff check platform pipelines scripts tests

  domain-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        domain: [ingestion, self_healing, insights, finops, rag, delivery, observability]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install domain dependencies
        shell: bash
        run: |
          requirements="pipelines/${{ matrix.domain }}/requirements.txt"
          if [ -f "$requirements" ]; then python -m pip install -r "$requirements"; fi
          python -m pip install pytest pytest-cov PyYAML
      - name: Run domain tests
        run: python -m pytest pipelines/${{ matrix.domain }}/tests -q --junitxml=junit-${{ matrix.domain }}.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-${{ matrix.domain }}
          path: junit-${{ matrix.domain }}.xml
          retention-days: 14

  platform-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest PyYAML jsonschema
      - run: python -m pytest tests/platform tests/recovery -q
