name: gold-quality

on:
  pull_request:
    paths: ["pipelines/gold/**", "tests/gold/**", "docs/gold/**", ".github/workflows/gold-quality.yml"]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gold:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Gold dependencies
        run: python -m pip install pytest PyYAML ruff
      - name: Lint Gold
        run: python -m ruff check pipelines/gold tests/gold
      - name: Test Gold
        run: python -m pytest pipelines/gold/tests tests/gold -q --ignore=pipelines/gold/tests/test_dags_integrity.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gold-test-results
          path: .pytest_cache
          if-no-files-found: ignore
