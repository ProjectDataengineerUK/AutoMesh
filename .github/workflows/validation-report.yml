name: validation-report

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install PyYAML
      - run: python scripts/validation/generate_report.py --output-dir artifacts/validation/latest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: automesh-validation-report
          path: artifacts/validation/latest
          retention-days: 30
