apiVersion: v3.1.0-lite
kind: DataContract
metadata:
  name: infra_telemetry
  version: 1
  description: "Telemetria sintética de infraestrutura (CPU/memória/latência por host)"
  owner: automesh-project
  domain: infra
  classification: internal

schema:
  type: kafka_topic
  topic: automesh.infra.telemetry.v1
  columns:
    - name: host_id
      type: string
      required: true
    - name: metric_name
      type: string
      required: true
    - name: metric_value
      type: decimal
      required: true
    - name: collected_at
      type: timestamp
      required: true

quality:
  freshness:
    maxStaleness: PT15M
  completeness:
    host_id: 1.0
    metric_value: 1.0

evolution:
  compatibility: additive-only

consumers:
  - name: fase1_bronze_writer
    usage: "Promoção ao Bronze após validação"
  - name: fase3_finops_agent
    usage: "Consumo futuro para dimensionamento de cluster (fora de escopo desta fase)"
